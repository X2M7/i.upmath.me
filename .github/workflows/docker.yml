name: Create and publish a Docker image

on:
  push:
    branches: ['master']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test

      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail

          container=upmath-smoke-test
          cleanup() {
            status=$?
            if [[ $status -ne 0 ]]; then
              docker logs "$container" || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run --detach --name "$container" --publish 127.0.0.1:8080:80 "${IMAGE_NAME}:test"
          curl --fail --silent --show-error \
            --retry 30 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8080/latex.js \
            --output /tmp/upmath-latex.js

          if grep --quiet 'i.upmath.me' /tmp/upmath-latex.js; then
            echo 'Generated latex.js still points to the upstream renderer' >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/ \
            --output /tmp/upmath-index.html
          grep --perl-regexp --quiet '/latex\.js\?[0-9a-f]{16}' /tmp/upmath-index.html

          curl --fail --silent --show-error --head \
            http://127.0.0.1:8080/latex.js \
            --output /tmp/upmath-latex.headers
          grep --ignore-case --quiet '^cache-control: max-age=300' /tmp/upmath-latex.headers

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/svg/x%5E2 \
            --output /tmp/upmath-smoke.svg
          grep --quiet '<svg' /tmp/upmath-smoke.svg

          blocked_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:8080/svg/%5Cinput%7B%2Fetc%2Fpasswd%7D')
          test "$blocked_status" = 400

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
