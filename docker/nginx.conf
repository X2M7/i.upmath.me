user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /var/log/nginx/access.log;

	gzip on;

	client_max_body_size 128k;
	client_body_timeout 10s;
	client_header_timeout 10s;
	keepalive_timeout 15s;
	send_timeout 30s;

	limit_req_zone $server_name zone=render_rate:10m rate=10r/s;
	limit_conn_zone $server_name zone=render_conn:10m;
	limit_req_status 429;
	limit_conn_status 429;

	# Cache successful images for 180 days at the CDN and one day in browsers.
	map $status $formula_cache_control {
		default "no-store";
		200 "public, max-age=86400, s-maxage=15552000";
		206 "public, max-age=86400, s-maxage=15552000";
		304 "public, max-age=86400, s-maxage=15552000";
	}
	map $status $formula_retry_after {
		default "";
		429 "5";
		503 "5";
	}

	upstream php-sock {
		server unix:/var/run/php-fpm/php-fpm.sock;
	}

	upstream php-tex-sock {
		server unix:/var/run/php-fpm/php-tex-fpm.sock;
	}

	server {
		listen 80;
		listen [::]:80;
		server_name _;

		root /var/www/i.upmath.me/www;
		access_log /var/www/i.upmath.me/logs/access.log;
		error_log /var/www/i.upmath.me/logs/error.log error;

		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" always;

		location ~ ^(?s)/(?<ext>svg|png|jpg|jpeg)/(?<formula>.*)$ {
			limit_except GET HEAD OPTIONS {
				deny all;
			}

			if ($request_method = OPTIONS) {
				return 204;
			}

			gunzip on;
			gzip_static always;
			gzip_vary on;
			gzip_proxied expired no-cache no-store private auth;

			add_header Access-Control-Allow-Origin "*" always;
			add_header Cache-Control $formula_cache_control always;
			add_header Retry-After $formula_retry_after always;
			add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
			add_header X-Content-Type-Options "nosniff" always;
			add_header Referrer-Policy "no-referrer" always;
			add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; sandbox allow-scripts" always;

			set_by_lua_block $file_path {
				local ext = ngx.var.ext
				if ext == "jpeg" then
					ext = "jpg"
				end

				local formula = ngx.var.formula:gsub("^%s*(.-)%s*$", "%1")
				local color = ngx.var.arg_c
				if not color or color == "" then
					color = ngx.var.arg_color or ""
				end
				color = color:lower():gsub("^#", "")
				if color:match("^[0-9a-f][0-9a-f][0-9a-f]$") then
					color = color:sub(1, 1):rep(2) .. color:sub(2, 2):rep(2) .. color:sub(3, 3):rep(2)
				elseif not color:match("^[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]$") then
					color = ""
				end
				if color ~= "" then
					color = "#" .. color
				end

				local hash = ngx.md5(formula .. "\n" .. ext .. "\n" .. color .. "\ncache-v2")
				return hash:sub(1, 2) .. "/" .. hash:sub(3, 4) .. "/" .. hash:sub(5) .. "." .. ext
			}

			if (-f $document_root/_error/$file_path) {
				return 400;
			}

			rewrite ^ /_cache/$file_path break;
			error_page 404 = @s2_latex_renderer;
			log_not_found off;
		}

		# Compressed formulas are decompressed only inside PHP with a hard output limit.
		location ~ ^/(?:svg|png|jpg|jpeg)b/ {
			limit_except GET HEAD OPTIONS {
				deny all;
			}

			if ($request_method = OPTIONS) {
				return 204;
			}

			add_header Access-Control-Allow-Origin "*" always;
			add_header Cache-Control $formula_cache_control always;
			add_header Retry-After $formula_retry_after always;
			add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
			add_header X-Content-Type-Options "nosniff" always;
			add_header Referrer-Policy "no-referrer" always;
			add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; sandbox allow-scripts" always;

			include /etc/nginx/fastcgi.conf;
			fastcgi_pass php-sock;
			fastcgi_hide_header Cache-Control;
			fastcgi_param SCRIPT_FILENAME $document_root/resolve.php;
			fastcgi_param SCRIPT_NAME /resolve.php;
			fastcgi_param HTTP_PROXY "";
			fastcgi_buffers 8 16k;
			fastcgi_buffer_size 32k;
			fastcgi_connect_timeout 5s;
			fastcgi_send_timeout 10s;
			fastcgi_read_timeout 35s;
		}

		location = /latex.js {
			gzip_static on;
			gzip_vary on;
			gzip_proxied expired no-cache no-store private auth;
			expires 5m;
		}

		location /css {
			gzip_static on;
			gzip_vary on;
			gzip_proxied expired no-cache no-store private auth;
		}

		location /js {
			gzip_static on;
			gzip_vary on;
			gzip_proxied expired no-cache no-store private auth;
		}

		location ^~ /test_out/ {
			return 404;
		}

		location ^~ /_cache/ {
			internal;
			gunzip on;
			gzip_static always;
			gzip_vary on;
			gzip_proxied expired no-cache no-store private auth;

			add_header Access-Control-Allow-Origin "*" always;
			add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
			add_header Cache-Control $formula_cache_control always;
			add_header Retry-After $formula_retry_after always;
			add_header X-Content-Type-Options "nosniff" always;
			add_header Referrer-Policy "no-referrer" always;
			add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; sandbox allow-scripts" always;

			error_page 404 = @s2_latex_renderer;
			log_not_found off;
		}

		location ^~ /_error/ {
			return 404;
		}

		location ~ /\. {
			return 404;
		}

		location / {
			index index.php;
		}

		location /g/ {
			try_files $uri $uri/ /index.php;
		}

		location /gb/ {
			try_files $uri $uri/ /index.php;
		}

		location = /index.php {
			limit_except GET HEAD {
				deny all;
			}

			include /etc/nginx/fastcgi.conf;
			fastcgi_pass php-sock;
			fastcgi_param HTTP_PROXY "";
		}

		location ~ \.php$ {
			return 404;
		}

		location @s2_latex_renderer {
			# An external request to the internal cache must not reach the renderer.
			if ($request_uri !~ "^/(svg|png|jpg|jpeg)b?/") {
				return 404;
			}

			# Queue normal article bursts; PHP-FPM still runs at most two TeX jobs.
			limit_req zone=render_rate burst=64;
			limit_conn render_conn 64;

			add_header Access-Control-Allow-Origin "*" always;
			add_header Cache-Control $formula_cache_control always;
			add_header Retry-After $formula_retry_after always;
			add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
			add_header X-Content-Type-Options "nosniff" always;
			add_header Referrer-Policy "no-referrer" always;
			add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; sandbox allow-scripts" always;

			include /etc/nginx/fastcgi.conf;
			fastcgi_pass php-tex-sock;
			fastcgi_hide_header Cache-Control;
			fastcgi_param SCRIPT_FILENAME $document_root/render.php;
			fastcgi_param SCRIPT_NAME /render.php;
			fastcgi_param HTTP_PROXY "";
			fastcgi_buffers 8 16k;
			fastcgi_buffer_size 32k;
			fastcgi_connect_timeout 5s;
			fastcgi_send_timeout 10s;
			fastcgi_read_timeout 35s;
		}
	}
}
