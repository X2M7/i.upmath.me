[unix_http_server]
file = /var/run/supervisor.sock
chmod = 0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root

[program:nginx]
command=nginx -g "daemon off;"
priority=10
stdout_logfile= /dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm8.4 -F --fpm-config /etc/php/8.4/fpm/pool.d/www.conf
priority=5
autostart=true
stdout_logfile= /dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-tex-fpm]
command=php-fpm8.4 -F --fpm-config /etc/php/8.4/fpm/pool.d/www-tex.conf
priority=5
autostart=true
stdout_logfile= /dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:http-svgo]
command=/usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin NODE_ENV=production NODE_PORT=8800 /usr/bin/node /var/www/i.upmath.me/src/http-svgo.js
user=www-data
priority=5
autostart=true
stdout_logfile= /dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

